name: test-build
# Builds unpatched Pumpkin refs (e.g. master and fix branches of a fork) as aarch64 musl binaries for lab tests.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON list like [{"name":"master","repo":"Pumpkin-MC/Pumpkin","ref":"master"}]'
        required: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Fetch ${{ matrix.target.repo }}@${{ matrix.target.ref }}
        run: |
          git clone --depth 1 --branch '${{ matrix.target.ref }}' 'https://github.com/${{ matrix.target.repo }}.git' src
          git -C src log -1 --format='%H %s'
      - name: Toolchain (musl, like the upstream release build)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup update stable && rustup default stable
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: master-arm64-musl
      - name: Build
        working-directory: src
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --target aarch64-unknown-linux-musl --bin pumpkin
      - name: Package
        run: |
          mkdir dist
          cp src/target/aarch64-unknown-linux-musl/release/pumpkin 'dist/pumpkin-${{ matrix.target.name }}'
          git -C src log -1 --format='%H' > 'dist/COMMIT-${{ matrix.target.name }}'
          (cd dist && sha256sum pumpkin-* > 'SHA256SUMS-${{ matrix.target.name }}')
      - uses: actions/upload-artifact@v4
        with:
          name: pumpkin-${{ matrix.target.name }}
          path: dist/
